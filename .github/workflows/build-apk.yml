name: Build IQ999 Cricket APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK (Bypassing Unused Services)
        run: |
          gradle assembleDebug \
            -x processDebugGoogleServices \
            -Djava.awt.headless=true \
            -Dorg.gradle.jvmargs="-Xmx3072m -Djava.awt.headless=true" \
            --no-daemon \
            --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IQ999-Cricket-App
          path: app/build/outputs/apk/debug/*.apk
