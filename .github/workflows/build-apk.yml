name: Build IQ999 Cricket APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix KSP and Build APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m"
        run: |
          gradle assembleDebug \
            -x processDebugGoogleServices \
            -Dksp.use.ksp2=false \
            -Djava.awt.headless=true \
            --no-daemon \
            --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IQ999-Cricket-App
          path: app/build/outputs/apk/debug/*.apk
